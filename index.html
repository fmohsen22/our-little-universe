<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17122B"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Universe"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>Our Little Universe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap">
<style>
/* Layout: a single phone-width column under a night sky. Home is a grid of six game tiles; each game is one card-led screen. */
:root {
  color-scheme: dark;
  --bg: #17122B; --bg-2: #211A3C; --surface: #272046; --surface-2: #322A57; --line: #463C73;
  --ink: #F5EFFF; --soft: #B9AEDA; --star: #6F64A3;
  --rose: #F58FA9; --gold: #F3C56E; --mint: #7FD8C4; --sky: #93BBFF; --peach: #F8A77B; --lilac: #BDA3FF;
  --on-accent: #23183A; --paper: #FFFDF8; --good: #7FD8C4; --bad: #F58FA9;
  --display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 20px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #FBF3F5; --bg-2: #F6E9EF; --surface: #FFFFFF; --surface-2: #F7EEF4; --line: #E4D3E0;
    --ink: #2A1F42; --soft: #6C5F86; --star: #D9C3D6;
    --rose: #F08AA5; --gold: #EDB850; --mint: #63CDB6; --sky: #86AEF7; --peach: #F59C6C; --lilac: #AE93F5;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #FBF3F5; --bg-2: #F6E9EF; --surface: #FFFFFF; --surface-2: #F7EEF4; --line: #E4D3E0;
  --ink: #2A1F42; --soft: #6C5F86; --star: #D9C3D6;
  --rose: #F08AA5; --gold: #EDB850; --mint: #63CDB6; --sky: #86AEF7; --peach: #F59C6C; --lilac: #AE93F5;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%;
  background-color: var(--bg);
  background-image: radial-gradient(var(--star) 1px, transparent 1.6px), radial-gradient(var(--star) 1.4px, transparent 2px), linear-gradient(var(--bg), var(--bg-2));
  background-size: 130px 130px, 210px 210px, 100% 100%; background-position: 20px 30px, 90px 120px, 0 0; background-attachment: fixed;
}
.wrap { max-width: 720px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3, .mark { font-family: var(--display); font-weight: 600; text-wrap: balance; line-height: 1.12; letter-spacing: -.01em; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.soft { color: var(--soft); }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.mid { justify-content: center; }
.row.split { justify-content: space-between; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mark { text-decoration: none; font-size: 1.15rem; font-style: italic; }
.mark-star { color: var(--gold); font-style: normal; }
.top-right { display: flex; gap: 8px; align-items: center; }
.sync { font-size: .78rem; color: var(--soft); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--soft); }
.sync[data-s="live"]::before { background: var(--good); }
.sync[data-s="error"]::before { background: var(--bad); }
.who { font: 600 .85rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; min-height: 40px; cursor: pointer; }
.who b { color: var(--gold); }

.btn { font: 700 1rem var(--body); min-height: 48px; padding: 10px 22px; border-radius: 999px; border: 0; cursor: pointer; background: var(--accent, var(--gold)); color: var(--on-accent); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: transform .12s ease; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { min-height: 40px; padding: 6px 16px; font-size: .9rem; }
.btn.big { width: 100%; min-height: 60px; font-size: 1.15rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.chip { font: 600 .9rem var(--body); min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent, var(--gold)); color: var(--on-accent); border-color: transparent; }
input[type="text"], textarea { width: 100%; min-width: 0; font: 1rem var(--body); color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 48px; }
textarea { resize: vertical; min-height: 76px; }
label { font-weight: 600; font-size: .9rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; }

/* home */
.hero { text-align: center; display: flex; flex-direction: column; gap: 8px; padding-block: 10px 2px; }
.eyebrow { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.hero h1 { font-size: clamp(2rem, 8vw, 3rem); }
.hero h1 em { color: var(--rose); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 16px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); transition: transform .15s ease, border-color .15s ease; }
.tile:hover { transform: translateY(-3px); border-color: var(--accent); }
.tile-emoji { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 1.7rem; background: var(--accent); margin-bottom: 6px; }
.tile h2 { font-size: 1.15rem; }
.tile p { color: var(--soft); font-size: .9rem; }
.surprise { background: var(--surface); border: 1px dashed var(--gold); border-radius: var(--r); padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; animation: rise .35s ease; }
.surprise h2 { font-size: 1.5rem; }
.book-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-decoration: none; }
details.setup { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; background: var(--surface); }
details.setup summary { cursor: pointer; font-weight: 600; }
details.setup[open] summary { margin-bottom: 12px; }
.note { font-size: .88rem; color: var(--soft); }

.board { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.board th, .board td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.board thead th { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.board th:first-child { text-align: left; font-weight: 600; }
.board td { font: 700 1.15rem var(--body); color: var(--gold); }
.board a { text-decoration: none; }
.board small, .rounds small { display: block; font-weight: 400; font-size: .78rem; color: var(--soft); }
.rounds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rounds li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rounds li span:last-child { text-align: right; font-weight: 600; }

/* ---------- The Crowns of Shahnameh ---------- */
.crown-link { text-decoration: none; font-size: 1.25rem; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--gold); background: var(--surface); }
.hall-link { border-color: var(--gold); }
.medal { flex: none; display: block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); }
.medal.locked { filter: grayscale(1); opacity: .38; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tab { flex: none; font: 600 .9rem var(--body); min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--gold); color: var(--on-accent); border-color: transparent; }
.profiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 620px) { .profiles { grid-template-columns: 1fr; } }
/* Profile panels are illuminated-manuscript plates: deliberately dark in both themes, tinted by kingdom. */
.profile { --k1: #EDB93C; --k2: #2FB57C; --k3: #6E1B38; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 26px 16px 18px; border-radius: var(--r); color: #FBF3DC; border: 1.5px solid var(--k1); background: radial-gradient(120% 80% at 50% 0%, var(--k3), #1B1430 75%); }
.profile.k-turan { --k1: #C9D3E6; --k2: #4C7BEA; --k3: #3B2470; }
.profile::before { content: ""; position: absolute; inset: 0 0 auto; height: 12px; background-image: repeating-linear-gradient(45deg, var(--k1) 0 2px, transparent 2px 9px), repeating-linear-gradient(-45deg, var(--k2) 0 2px, transparent 2px 9px); opacity: .85; }
.p-head { display: flex; gap: 10px; align-items: center; }
.p-head h2 { font-size: 1.35rem; overflow-wrap: anywhere; }
.p-kingdom { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--k1); }
.p-rank { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.p-title { font-family: var(--display); font-size: 1.3rem; color: var(--k1); }
.p-sub { font-size: .82rem; color: #CFC3E6; text-align: center; }
.profile .bar { background: rgba(255, 255, 255, .14); }
.profile .bar i { background: var(--k1); }
.profile .chip { color: #FBF3DC; border-color: rgba(255, 255, 255, .3); }
.profile .chip[aria-pressed="true"] { background: var(--k1); color: #1B1430; }
.p-edit { display: flex; flex-direction: column; gap: 8px; align-items: center; border-top: 1px solid rgba(255, 255, 255, .16); padding-top: 12px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 34px; }
.holder { font-size: 1rem; }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 0; text-align: center; }
@media (max-width: 420px) { .stats4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats4 dt { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.stats4 dd { margin: 0; font: 700 1.5rem var(--display); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--gold); }
.medals { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 620px) { .medals { grid-template-columns: 1fr; } }
.medal-card { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 16px; border: 1px dashed var(--line); min-width: 0; }
.medal-card > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.medal-card small { font-size: .8rem; color: var(--soft); }
.medal-card.earned { border: 1px solid var(--gold); background: var(--surface-2); }
.medal-card .got { color: var(--gold); font-weight: 700; }
.medal-card.legendary { box-shadow: 0 0 0 1px var(--gold), 0 0 22px -6px var(--gold); }
.medal-card.legendary .medal { animation: shimmer 3.2s ease-in-out infinite; }
@keyframes shimmer { 0%, 100% { filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)) brightness(1); } 50% { filter: drop-shadow(0 0 9px #EDB93C) brightness(1.18); } }
.lore summary { cursor: pointer; font-size: .82rem; font-weight: 600; color: var(--gold); padding: 4px 0; }
.lore p { font-size: .88rem; margin-top: 6px; }
.legend h2 { font-size: 1.3rem; color: var(--gold); }
.chron, .trophies { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.chron li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.chron li span { min-width: 0; overflow-wrap: anywhere; }
.chron li.unlock span { color: var(--gold); font-weight: 700; }
.chron small, .trophies small { flex: none; font-size: .78rem; color: var(--soft); }
.trophies li { display: flex; gap: 12px; align-items: center; padding: 6px 0; font-weight: 600; }
.trophies small { display: block; font-weight: 400; }
.board .total th, .board .total td { border-bottom: 0; font-weight: 700; }
.banner { border: 1.5px solid var(--gold); background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; animation: rise .3s ease; }
.revenge { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; font-style: italic; }
.ceremony { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(12, 8, 26, .82); overflow-y: auto; }
.cer-box { width: min(100%, 420px); text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 26px 20px 22px; border-radius: 24px; color: #FBF3DC; border: 1.5px solid #EDB93C; background: radial-gradient(120% 70% at 50% 0%, #6E1B38, #1B1430 78%); animation: rise .35s ease; }
.cer-box .eyebrow { color: #EDB93C; }
.cer-box .soft { color: #CFC3E6; }
.cer-box h2 { font-size: 1.9rem; color: #FFE08A; }
.cer-name { font-weight: 600; letter-spacing: .04em; }
.cer-art { animation: reveal .9s cubic-bezier(.2, 1.3, .4, 1); }
.cer-box.legendary .cer-art { filter: drop-shadow(0 0 18px #EDB93C); }
.cer-box .btn.ghost { color: #FBF3DC; border-color: rgba(255, 255, 255, .35); }
@keyframes reveal { from { transform: scale(.2) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* game shell */
.back { text-decoration: none; font-weight: 600; font-size: .9rem; color: var(--soft); align-self: flex-start; padding: 6px 0; }
.ghead { display: flex; gap: 12px; align-items: center; }
.ghead .tile-emoji { margin: 0; flex: none; }
.ghead h1 { font-size: 1.7rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card.feature { border-color: var(--accent); min-height: 210px; justify-content: center; text-align: center; }
.card.feature .big-text { font-family: var(--display); font-size: clamp(1.35rem, 5.4vw, 1.8rem); line-height: 1.25; }
.tag { align-self: center; font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 3px 12px; }
.turn { font-weight: 600; color: var(--gold); }
.flip { animation: flip .4s ease; }
@keyframes flip { from { transform: rotateY(70deg) scale(.96); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(8px); opacity: .3; } to { transform: none; opacity: 1; } }
.score { display: flex; gap: 10px; justify-content: center; }
.score span { background: var(--surface-2); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.score b { color: var(--gold); }
.timer { font: 700 2rem var(--display); font-variant-numeric: tabular-nums; text-align: center; }
.timer.low { color: var(--rose); }

.story { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.story li { background: var(--surface-2); border-radius: 14px; padding: 10px 14px; overflow-wrap: anywhere; }
.story li b { color: var(--gold); font-size: .8rem; display: block; }
.story li.twist { border: 1px dashed var(--rose); background: transparent; font-style: italic; }
.story li.twist b { color: var(--rose); }
.scene { font-family: var(--display); font-size: 1.2rem; line-height: 1.4; }
.scene mark { background: none; color: var(--accent); font-style: italic; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option { text-align: left; font: 1rem var(--body); color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; min-height: 52px; cursor: pointer; overflow-wrap: anywhere; }
div.option { cursor: default; }
.option.lie { border-color: var(--rose); }
.option.truth { border-color: var(--mint); }
.option small { display: block; font-weight: 700; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.option.lie small { color: var(--rose); } .option.truth small { color: var(--mint); }
.lie-pick { display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: .85rem; color: var(--soft); }
.lie-pick input { width: 20px; height: 20px; accent-color: var(--rose); }

.pad { position: relative; width: 100%; max-width: 480px; margin: 0 auto; aspect-ratio: 1; border-radius: var(--r); overflow: hidden; border: 2px solid var(--line); background: var(--paper); }
.pad canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); outline: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { outline: 3px solid var(--gold); }
.guesses { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 30px; }
.guesses li { background: var(--surface-2); border-radius: 999px; padding: 3px 12px; font-size: .9rem; overflow-wrap: anywhere; }
.secret { font-family: var(--display); font-size: 1.6rem; color: var(--accent); text-align: center; }

.letter { font: 600 4rem/1 var(--display); color: var(--accent); text-align: center; }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.checks label { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-weight: 500; }
.checks input { width: 20px; height: 20px; accent-color: var(--gold); }
.review { display: flex; flex-direction: column; gap: 10px; }
.review-row { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.review-row h3 { font: 700 .8rem var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.ans { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ans span { min-width: 0; overflow-wrap: anywhere; }
.ans small { color: var(--soft); display: block; }
.pts { flex: none; min-width: 56px; min-height: 40px; border-radius: 999px; border: 0; font: 700 1rem var(--body); cursor: pointer; background: var(--gold); color: var(--on-accent); font-variant-numeric: tabular-nums; }
.pts[data-v="0"] { background: var(--line); color: var(--ink); }
.pts[data-v="5"] { background: var(--sky); }

.memories { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.memories li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; overflow-wrap: anywhere; }
.memories .meta { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--soft); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; align-items: center; }
.memories pre { margin: 0; font: inherit; white-space: pre-wrap; }
.linkbtn { background: none; border: 0; color: var(--soft); font: 600 .8rem var(--body); cursor: pointer; text-decoration: underline; padding: 6px 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem; z-index: 20; text-align: center; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<div class="wrap">
  <header class="top">
    <a class="mark" href="#home"><span class="mark-star" aria-hidden="true">✦</span> Our Little Universe</a>
    <div class="top-right">
      <a class="crown-link" href="#hall" aria-label="The Royal Hall">👑</a>

/* Two-phone play. Active only when config.js names your own room server (serverUrl) or a Supabase project.
   Each couple plays in a room named by a long random code carried in the invite link (?room=...).
   With your own server (server/server.js) moves are posted to it and pushed to the other phone over
   Server-Sent Events. With Supabase they travel over a Realtime broadcast channel and are saved
   through three database functions (supabase/schema.sql). The object returned looks like the store app.js expects:
   doc(path) with set, update and onSnapshot. */
(function () {
  'use strict';
  var cfg = window.OLU_CONFIG || {};
  var useServer = !!cfg.serverUrl, useSupabase = !!(cfg.supabaseUrl && cfg.supabaseAnonKey);
  if (!useServer && !useSupabase) return;
  function lsGet(k) { try { var v = window.localStorage.getItem('olu:' + k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem('olu:' + k, JSON.stringify(v)); } catch (e) { /* fine */ } }
  function code(n) { var a = new Uint8Array(n), s = '', abc = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; window.crypto.getRandomValues(a); for (var i = 0; i < n; i++) s += abc[a[i] % abc.length]; return s; }

  var ok = /^[A-Za-z0-9_-]{12,64}$/, fromLink = new URLSearchParams(window.location.search).get('room');
  var invited = !!fromLink && ok.test(fromLink) && fromLink !== lsGet('room');
  var room = (fromLink && ok.test(fromLink)) ? fromLink : (lsGet('room') || code(20));
  if (invited && lsGet('me') === null) lsSet('me', 1);   // the person who receives the link is player two
  lsSet('room', room);
  try { window.history.replaceState(null, '', window.location.pathname + '?room=' + room + window.location.hash); } catch (e) { /* keep the address as is */ }
  window.OLU_ROOM = { id: room, link: window.location.origin + window.location.pathname + '?room=' + room };

  function loadScript(src) { return new Promise(function (res, rej) { if (window.supabase && window.supabase.createClient) return res(); var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

  // Your own server: plain fetch plus an EventSource that reconnects by itself.
  function serverBackend(opts) {
    var base = String(cfg.serverUrl).replace(/\/+$/, '') + '/rooms/' + room, me = code(8);
    var cache = {}, subs = {}, fails = [], loaded = false;
    var snap = function (name) { var d = cache[name]; return { exists: d !== undefined, data: function () { return d; }, metadata: {} }; };
    var emit = function (name) { (subs[name] || []).forEach(function (f) { f(snap(name)); }); };
    var fail = function (e) { fails.forEach(function (f) { if (f) f(e); }); };
    function load() {
      return fetch(base, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('server ' + r.status); return r.json(); })
        .then(function (j) { cache = j.docs || {}; loaded = true; Object.keys(subs).forEach(emit); });
    }
    function post(name, kind, body) {
      return fetch(base + '/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: kind, body: body, from: me }) })
        .then(function (r) { if (!r.ok) throw new Error('server ' + r.status); });
    }
    var es = new EventSource(base + '/events');
    es.onopen = function () { load().catch(fail); };          // also runs after every reconnect, so nothing is missed
    es.onerror = function () { if (!loaded) fail(new Error('unreachable')); };

    return Promise.resolve({
      doc: function (path) {
        var name = path.split('/').pop();
        return {
          set: function (body) { cache[name] = body; return post(name, 'set', body); },
          update: function (body) { cache[name] = merge(cache[name] || {}, JSON.parse(JSON.stringify(body))); return post(name, 'patch', body); },
          onSnapshot: function (next, err) { (subs[name] = subs[name] || []).push(next); fails.push(err); if (loaded) next(snap(name)); return function () {}; }
        };
      }
    });
  }

  window.OLU_BACKEND = function (opts) {
    if (useServer) return serverBackend(opts);
    return loadScript('vendor/supabase.js').then(function () {
      var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: false, autoRefreshToken: false } });
      var cache = {}, subs = {}, fails = [], loaded = false, me = code(8);
      var snap = function (name) { var d = cache[name]; return { exists: d !== undefined, data: function () { return d; }, metadata: {} }; };
      var emit = function (name) { (subs[name] || []).forEach(function (f) { f(snap(name)); }); };
      var fail = function (e) { fails.forEach(function (f) { if (f) f(e); }); };
      var check = function (r) { if (r && r.error) throw r.error; };
      var ch = sb.channel('olu-' + room, { config: { broadcast: { self: false }, presence: { key: me } } });
      function load() {
        return sb.rpc('olu_load', { p_room: room }).then(function (r) {
          check(r); (r.data || []).forEach(function (d) { cache[d.name] = d.data; });
          loaded = true; Object.keys(subs).forEach(emit);
        });
      }
      ch.on('broadcast', { event: 'op' }, function (m) {
        var p = m && m.payload; if (!p || !p.name) return;
        cache[p.name] = p.kind === 'set' ? p.body : merge(cache[p.name] || {}, p.body); emit(p.name);
      });
      ch.on('presence', { event: 'sync' }, function () { if (opts && opts.onPeers) opts.onPeers(Object.keys(ch.presenceState()).length); });
      ch.subscribe(function (status) { if (status === 'SUBSCRIBED') { ch.track({ at: Date.now() }); load().catch(fail); } });
      document.addEventListener('visibilitychange', function () { if (!document.hidden && loaded) load().catch(function () { /* keep what we have */ }); });
      var send = function (name, kind, body) { try { ch.send({ type: 'broadcast', event: 'op', payload: { name: name, kind: kind, body: body } }); } catch (e) { /* saved below anyway */ } };
      return {
        doc: function (path) {
          var name = path.split('/').pop();
          return {
            set: function (body) { cache[name] = body; send(name, 'set', body); return sb.rpc('olu_save', { p_room: room, p_name: name, p_data: body }).then(check); },
            update: function (body) { cache[name] = merge(cache[name] || {}, JSON.parse(JSON.stringify(body))); send(name, 'patch', body); return sb.rpc('olu_patch', { p_room: room, p_name: name, p_part: body }).then(check); },
            onSnapshot: function (next, err) { (subs[name] = subs[name] || []).push(next); fails.push(err); if (loaded) next(snap(name)); return function () {}; }
          };
        }
      };
    }).catch(function () { return null; });
  };
})();

      '<div class="p-rank">' + (rank ? art(rank.art, rank.metal, 104, rank.badge) : art('lock', 'bronze', 104, 'No crown yet', true)) +
      '<p class="p-title">' + (rank ? esc(R.rankTitle(rank, pr)) : 'Not yet crowned') + '</p><p class="p-sub">' + (rank ? rank.badge : 'Win a competitive round to earn the Bronze Shield') + '</p></div>' +
      '<dl class="stats4"><div><dt>Victories</dt><dd>' + p.wins + '</dd></div><div><dt>Losses</dt><dd>' + p.losses + '</dd></div><div><dt>Win streak</dt><dd>' + p.streak + '</dd></div><div><dt>Best streak</dt><dd>' + p.best + '</dd></div></dl>' +
      (next ? bar(p.wins, next.wins) + '<p class="p-sub">' + (next.wins - p.wins) + ' more ' + (next.wins - p.wins === 1 ? 'victory' : 'victories') + ' to ' + esc(R.rankTitle(next, pr)) + '</p>' : '<p class="p-sub">Every crown is won. The poets take over from here.</p>') +
      '<p class="p-sub">' + earned.length + ' ' + (earned.length === 1 ? 'badge' : 'badges') + ' unlocked</p><div class="thumbs">' + earned.slice(-8).map(function (u) { var d = u.kind === 'rank' ? R.rank(u.id) : R.achievement(u.id); return art(d.art, d.metal, 34, unlockName(u)); }).join('') + '</div>' +
      (mine ? '<div class="p-edit"><div class="row" role="group" aria-label="Your kingdom"><button class="chip" data-act="kingdom" data-k="iran" aria-pressed="' + (pr.kingdom === 'iran') + '">Iran</button><button class="chip" data-act="kingdom" data-k="turan" aria-pressed="' + (pr.kingdom === 'turan') + '">Turan</button></div>' +
        '<div class="row" role="group" aria-label="Your title">' + ['Prince', 'Princess', 'Champion'].map(function (t) { return '<button class="chip" data-act="royal" data-r="' + t + '" aria-pressed="' + (pr.royal === t) + '">' + t + '</button>'; }).join('') + '</div></div>' : '') + '</section>';
  }
  function medalCard(def, at, value, goal, title, extra) {
    var hid = def.hidden && !at;
    return '<li class="medal-card' + (at ? ' earned' : '') + (def.legendary && at ? ' legendary' : '') + '">' + (hid ? art('lock', 'bronze', 64, 'Hidden achievement', true) : art(def.art, def.metal, 64, title, !at)) +
      '<div><b>' + (hid ? 'A hidden achievement' : esc(title)) + '</b><small>' + (hid ? 'Keep playing together. It unlocks by doing something real, not by luck.' : esc(extra)) + '</small>' +
      (at ? '<small class="got">Unlocked ' + day(at) + '</small>' : bar(value, goal) + '<small>' + Math.min(value, goal) + ' of ' + goal + '</small>') + (hid ? '' : story(def.story)) + '</div></li>';
  }
  function glory(i, s) {
    var p = s.players[i], pr = prof(i);
    return '<div class="card"><p><b>' + esc(T(i)) + '</b> <span class="note">royal ranks</span></p><ul class="medals">' + R.RANKS.map(function (r) { return medalCard(r, p.ranks[r.id], p.wins, r.wins, R.rankTitle(r, pr), r.badge + ' · ' + r.wins + (r.wins === 1 ? ' victory' : ' victories')); }).join('') + '</ul>' +
      '<p><b>Individual glory</b></p><ul class="medals">' + R.ACHIEVEMENTS.filter(function (a) { return a.scope === 'individual'; }).map(function (a) { return medalCard(a, p.ach[a.id], a.value(s, i), a.goal, a.name, a.desc); }).join('') + '</ul></div>';
  }

  O.views.hall = {
    emoji: '👑', title: 'The Royal Hall', sub: '', accent: 'gold', deps: ['events', 'players', 'challenge'],
    how: 'The Crowns of Shahnameh: two rival kingdoms, one long and friendly war.',
    render: function (root) {
      var s = O.royal(), me = O.me(), body;
      var tabs = '<div class="tabs" role="tablist">' + TABS.map(function (t) { return '<button role="tab" class="tab" data-act="tab" data-t="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>';
      if (tab === 'glory') body = glory(me, s) + glory(1 - me, s);
      else if (tab === 'shared') body = '<div class="card"><p><b>Shared glory</b> <span class="note">earned together, unlocked for both of you</span></p><dl class="stats4"><div><dt>Adventures together</dt><dd>' + s.shared.activities + '</dd></div><div><dt>Cooperative</dt><dd>' + s.shared.coop + '</dd></div><div><dt>Matches</dt><dd>' + s.shared.matches + '</dd></div><div><dt>Countries</dt><dd>' + s.shared.countries.length + '</dd></div></dl><ul class="medals">' +
        R.ACHIEVEMENTS.filter(function (a) { return a.scope === 'shared'; }).map(function (a) { return medalCard(a, s.shared.ach[a.id], a.value(s, 0), a.goal, a.name, a.desc); }).join('') + '</ul></div>';
      else if (tab === 'history') { var h = s.history.slice(-80).reverse(); body = '<div class="card">' + (h.length ? '<ol class="chron">' + h.map(function (x) { return '<li class="' + (x.t === 'unlock' ? 'unlock' : '') + '"><span>' + esc(describe(x)) + '</span><small>' + when(x.at) + '</small></li>'; }).join('') + '</ol>' : '<p class="soft center">The chronicle is empty. Play a round and the scribes will start writing.</p>') + '</div>'; }
      else if (tab === 'legends') body = '<p class="note center">Short introductions to the people and places behind the badges. The stories are from Ferdowsi’s Shahnameh; the ranks, badges and rules are fiction made for this game.</p>' + ['irantu', 'sistan', 'zal', 'rudabeh', 'simurgh', 'rostam', 'khosrow', 'afrasiab', 'ferdowsi', 'miniature'].map(function (k) { var x = STORIES[k]; return '<div class="card legend"><h2>' + x.title + '</h2><p>' + x.book + '</p><p class="note"><b>In our game.</b> ' + x.game + '</p></div>'; }).join('');
      else {
        var wins = s.history.filter(function (x) { return x.t === 'match' && x.w >= 0; }).slice(-5).reverse(), ul = s.unlocks.slice(-5).reverse();
        body = '<div class="profiles">' + profile(0, s) + profile(1, s) + '</div>' +
          '<div class="card"><p><b>Head to head</b> <span class="note">' + (s.leader < 0 ? (s.shared.matches ? 'Level. The crown waits.' : 'No battles yet') : esc(T(s.leader)) + ' holds the crown') + '</span></p><table class="board"><thead><tr><th scope="col">Battle</th><th scope="col">' + esc(N(0)) + '</th><th scope="col">' + esc(N(1)) + '</th><th scope="col">Ties</th></tr></thead><tbody>' +
          R.COMPETITIVE.map(function (g) { var b = s.h2h.byGame[g]; return '<tr><th scope="row">' + O.views[g].emoji + ' ' + gameName(g) + '</th><td>' + b.wins[0] + '</td><td>' + b.wins[1] + '</td><td>' + b.ties + '</td></tr>'; }).join('') +
          '<tr class="total"><th scope="row">All battles</th><td>' + s.h2h.wins[0] + '</td><td>' + s.h2h.wins[1] + '</td><td>' + s.h2h.ties + '</td></tr></tbody></table>' +
          '<p class="note">Issue a royal challenge:</p><div class="row">' + R.COMPETITIVE.map(function (g) { return '<button class="btn small ghost" data-act="challenge" data-g="' + g + '">' + O.views[g].emoji + ' ' + gameName(g) + '</button>'; }).join('') + '</div></div>' +
          '<div class="card"><p><b>Together</b></p><dl class="stats4"><div><dt>Adventures together</dt><dd>' + s.shared.activities + '</dd></div><div><dt>Cooperative</dt><dd>' + s.shared.coop + '</dd></div><div><dt>Shared badges</dt><dd>' + Object.keys(s.shared.ach).length + '</dd></div><div><dt>Countries</dt><dd>' + s.shared.countries.length + '</dd></div></dl></div>' +
          '<div class="card"><p><b>Recent victories</b></p>' + (wins.length ? '<ol class="chron">' + wins.map(function (x) { return '<li><span>' + esc(describe(x)) + '</span><small>' + when(x.at) + '</small></li>'; }).join('') + '</ol>' : '<p class="soft">None yet. Two Truths, versus Missions and Esm Famil count.</p>') +
          '<p><b>Recent badges</b></p>' + (ul.length ? '<ul class="trophies">' + ul.map(function (u) { var d = u.kind === 'rank' ? R.rank(u.id) : R.achievement(u.id); return '<li>' + art(d.art, d.metal, 56, unlockName(u)) + '<span>' + esc(unlockName(u)) + '<small>' + (u.p < 0 ? 'Both of you' : esc(N(u.p))) + ' · ' + day(u.at) + '</small></span></li>'; }).join('') + '</ul>' : '<p class="soft">Your trophy shelf is still empty.</p>') + '</div>';
      }
      root.innerHTML = O.shell(this, tabs + body);
    },
    acts: {
      tab: function (el) { tab = el.dataset.t; O.render(); },
      kingdom: function (el) { var k = S.players.kingdoms.slice(); k[O.me()] = el.dataset.k; O.patch('players', { kingdoms: k }); },
      royal: function (el) { var r = S.players.royals.slice(); r[O.me()] = el.dataset.r; O.patch('players', { royals: r }); }
    }
  };

  /* ---------- the Royal Promotion Ceremony ---------- */
  var queue = [], showing = false, cur = null, RECENT = 10 * 60 * 1000;
  function checkUnlocks() {
    var s = O.royal(), seen = O.lsGet('seen', null), first = !seen, map = {};
    (seen || []).forEach(function (k) { map[k] = 1; });
    s.unlocks.forEach(function (u) { if (map[u.key]) return; map[u.key] = 1; if (!first && Date.now() - u.at < RECENT) queue.push(u); });
    O.lsSet('seen', Object.keys(map)); if (!showing) nextCeremony();
  }
  function nextCeremony() {
    var u = queue.shift(), box = $('#ceremony'); if (!u) { showing = false; box.hidden = true; box.textContent = ''; return; }
    showing = true; cur = u;
    var rank = u.kind === 'rank', d = rank ? R.rank(u.id) : R.achievement(u.id), me = O.me();
    var eyebrow = u.p < 0 ? '💞 Shared glory' : u.p !== me ? 'News from the rival kingdom' : rank ? '👑 A new ruler rises' : '✨ A legend is written';
    var line = rank ? d.wins + (d.wins === 1 ? ' victory' : ' victories') + ' achieved!' : d.desc;
    var cheer = rank ? d.cheer : u.p < 0 ? 'Both kingdoms celebrate. For one evening, there is peace.' : 'The scribes have added a new page to your legend.';
    box.innerHTML = '<div class="cer-box' + (d.legendary ? ' legendary' : '') + '" role="dialog" aria-modal="true" aria-labelledby="cer-title"><p class="eyebrow">' + eyebrow + '</p><div class="cer-art">' + art(d.art, d.metal, 150, unlockName(u)) + '</div>' +
      '<p class="cer-name">' + (u.p < 0 ? esc(N(0)) + ' & ' + esc(N(1)) : esc(T(u.p))) + '</p><h2 id="cer-title">' + esc(unlockName(u)) + '</h2><p>' + esc(line) + '</p><p class="soft">' + esc(u.p >= 0 && u.p !== me ? T(u.p) + ' will be unbearable about this.' : cheer) + '</p>' +
      '<div class="row mid"><button class="btn" data-cer="view">View in the Royal Hall</button><button class="btn ghost" data-cer="close">Continue playing</button></div></div>';
    box.hidden = false; if (u.p === me || u.p < 0) O.celebrate();
    var b = box.querySelector('[data-cer="close"]'); if (b) b.focus();
  }
  function closeCeremony(view) { if (view) { tab = view; queue.length = 0; if (window.location.hash === '#hall') O.render(); else window.location.hash = 'hall'; } nextCeremony(); }

  /* ---------- royal challenges and rematches ---------- */
  var OPEN = 15 * 60 * 1000;
  O.banner = function () {
    var c = S.challenge, me = O.me(); if (!c || !c.id || Date.now() - c.at > OPEN || !O.views[c.game]) return '';
    var g = O.views[c.game].emoji + ' ' + gameName(c.game), inner = '';
    if (c.state === 'open' && c.from !== me) inner = '<p><b>' + (c.rematch ? '“Your Majesty, your kingdom demands revenge!” ' + esc(T(c.from)) + ' wants a rematch.' : esc(T(c.from)) + ' challenges ' + esc(T(me)) + ' to a battle for the crown!') + '</b></p><p class="note">' + g + '</p><div class="row"><button class="btn small" data-act="accept">Accept the challenge</button><button class="btn small ghost" data-act="decline">Not now</button></div>';
    else if (c.state === 'open') inner = '<p><b>Your challenge has been sent to ' + esc(T(1 - me)) + '.</b></p><p class="note">' + g + ' · waiting for an answer</p><div class="row"><button class="btn small ghost" data-act="withdraw">Withdraw</button></div>';
    else if (c.state === 'accepted' && c.from === me) inner = '<p><b>' + esc(T(1 - me)) + ' accepts your challenge!</b></p><div class="row"><a class="btn small" href="#' + c.game + '" data-act="withdraw">To the battlefield</a></div>';
    else if (c.state === 'declined' && c.from === me) inner = '<p><b>' + esc(T(1 - me)) + ' declines, for now.</b></p><div class="row"><button class="btn small ghost" data-act="withdraw">Very well</button></div>';
    return inner ? '<div id="banner" class="banner" role="status">' + inner + '</div>' : '';
  };
  O.rematchRow = function (game) {
    var s = O.royal(), last = null, c = S.challenge;
    s.history.forEach(function (h) { if (h.t === 'match' && h.g === game) last = h; });
    if (!last || last.w !== 1 - O.me() || (c.id && c.state === 'open' && Date.now() - c.at < OPEN)) return '';
    return '<div class="revenge"><p>“Your Majesty, your kingdom demands revenge!”</p><button class="btn small" data-act="challenge" data-g="' + game + '" data-rematch="1">Demand a rematch</button></div>';
  };
  O.acts = {
    challenge: function (el) { O.save('challenge', { id: O.uid(), from: O.me(), game: el.dataset.g, rematch: !!el.dataset.rematch, at: Date.now(), state: 'open' }); O.toast('Challenge sent to ' + T(1 - O.me())); },
    accept: function () { var g = S.challenge.game; O.patch('challenge', { state: 'accepted' }); window.location.hash = g; },
    decline: function () { O.patch('challenge', { state: 'declined' }); },
    withdraw: function () { O.patch('challenge', { state: '' }); }
  };

  O.onDoc = function (name) { if (name === 'events') checkUnlocks(); };
  O.boot = function () {
    $('#ceremony').addEventListener('click', function (e) { var b = e.target.closest('[data-cer]'); if (b) closeCeremony(b.dataset.cer === 'view' ? (cur && cur.p < 0 ? 'shared' : 'glory') : null); else if (e.target.id === 'ceremony') closeCeremony(null); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && showing) closeCeremony(null); });
    checkUnlocks();
  };
  O.art = art;
})();

window.OLU.start();</script>
</body></html>
